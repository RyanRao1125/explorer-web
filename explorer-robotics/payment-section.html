<!-- PAYMENT SECTION — paste this as the last form-section, right before the SUBMIT button -->
<div class="form-section">
  <h3 class="form-section-title">
    <span class="form-section-num">6</span>
    Payment Information
  </h3>
  <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:16px;">
    Your card will be charged for the first month today. Your subscription will automatically renew monthly until cancelled. You can cancel anytime by contacting us.
  </p>

  <div class="badge" style="padding:24px;">
    <div class="field">
      <label for="card-element">Card Details <span class="required">*</span></label>
      <div id="card-element" style="padding:14px 16px;border:2px solid rgba(22,19,16,0.2);border-radius:var(--radius-sm);background:var(--cream-panel);"></div>
      <span class="field-error" id="card_error" style="display:block;margin-top:8px;"></span>
    </div>
  </div>

  <div class="cart-total-row" style="margin-top:16px;padding-top:16px;border-top:2px dashed rgba(22,19,16,0.15);">
    <span>Charging Today</span>
    <strong id="paymentTotalDisplay">$0/month</strong>
  </div>
</div>
